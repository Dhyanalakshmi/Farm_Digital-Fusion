<!DOCTYPE html>
<html lang="en">
<head>
    <title>Order Confirmation</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f8f9fa;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        .details {
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        button {
            padding: 12px 20px;
            margin-top: 10px;
            width: 100%;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .payment-btn { background-color: #28a745; }
        .payment-btn:hover { background-color: #218838; }
        .back-btn { background-color: #dc3545; }
        .back-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Order Confirmation</h1>

        <div class="details">
            <p><strong>Product:</strong> {{ order.product.name }}</p>
            <p><strong>Category:</strong> {{ order.product.category }}</p>
            <p><strong>Seller:</strong> {{ order.product.seller.username }}</p>
            <p><strong>Quantity:</strong> {{ order.quantity }} {{ order.product.unit }}</p>
            <p><strong>Price per unit:</strong> ₹{{ order.product.price }}</p>
            <p><strong>Total Price:</strong> ₹{{ order.total_price }}</p>
        </div>

        <!-- Proceed to Payment Button -->
        <a href="{% url 'transaction_page' order.id %}">
            <button class="payment-btn">Proceed to Payment</button>
        </a>

        <!-- Back to Buyers Page -->
        <a href="{% url 'buyers' %}">
            <button class="back-btn">Back to Buyers Page</button>
        </a>
    </div>

</body>
</html>
