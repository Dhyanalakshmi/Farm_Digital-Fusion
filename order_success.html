<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed Successfully</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #f4f4f4; 
            padding: 50px; 
        }
        .container { 
            max-width: 450px; 
            margin: auto; 
            padding: 30px; 
            background: #fff; 
            border-radius: 10px; 
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); 
        }
        h1 { 
            color: #28a745; 
            font-size: 24px; 
        }
        p { 
            color: #555; 
            font-size: 18px; 
        }
        .order-icon {
            font-size: 50px; 
            color: #28a745; 
        }
        button {
            padding: 12px 20px; 
            width: 100%; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="order-icon">✅</div>
        <h1>Order Placed Successfully!</h1>
        <p>Thank you for shopping with us! 🎉</p>
        <p>Your order will be delivered soon.</p>
        <a href="{% url 'home' %}">
            <button>Go to Home</button>
        </a>
    </div>

</body>
</html>
